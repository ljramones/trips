spring:
  application:
    ui:
      title: Terran Republic Interstellar Plotting System (TRIPS)
  aop:
      proxy-target-class: true

  # spring datasource requirements
  datasource:
    hikari:
      minimum-idle: 0
      initialization-fail-timeout: -1
      connectionTimeout: 20000
      maximumPoolSize: 5
      poolName: HikariPoolTrips
    url: jdbc:h2:file:${trips.dataDirectory:${user.home}/.trips/data}/tripsdb;DB_CLOSE_ON_EXIT=TRUE;WRITE_DELAY=100;FILE_LOCK=FS
    driverClassName: org.h2.Driver
    username: sa
    password:

  jpa:
    databasePlatform: org.hibernate.dialect.H2Dialect
    show-sql: false
    hibernate:
      # 'update' is the dev default while Phase 0.2 is in transition.
      # The 'prod' profile (application-prod.yml) overrides this to 'validate'.
      # Plan: flip the default to 'validate' once Phase 1.4 (orphan-column cleanup) lands.
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        # Batch insert optimisation. Aligned with RegularStarCatalogCsvReader.BATCH_SIZE
        # so each parse batch becomes one JDBC batch round-trip (Phase 1.3). Previously
        # 50, which created ~100x extra round-trips on the 2M-star HYG import.
        jdbc:
          batch_size: 5000
          batch_versioned_data: true
        # Reorder inserts/updates for better batching
        order_inserts: true
        order_updates: true
        # ===== Hibernate L2 cache (Phase 7 / Issue 53) =====
        # Caching is opt-in per entity via @org.hibernate.annotations.Cache.
        # Today only DataSetDescriptor uses it — keeps blast radius small
        # while the pattern beds in. EhCache 3.10 (Jakarta classifier) is
        # the JCache provider; regions are defined in ehcache.xml.
        cache:
          use_second_level_cache: true
          use_query_cache: false
          region:
            factory_class: jcache
        # Hibernate uses jakarta.cache.CacheManager via the JCache 1.0
        # JSR-107 SPI; the `hibernate.javax.cache.*` namespace is the
        # spec-defined property keys (the "javax" prefix predates the
        # Jakarta rename and is kept on the Hibernate side for
        # backwards-compat). The CacheManager itself is built by
        # JCacheBootstrap.jakartaCacheManager() (config/cache/) because
        # JCache's URI.create(...) can't resolve Spring's `classpath:`
        # prefix; the bootstrap reads ehcache.xml off the classpath and
        # passes a real file URI to EhCache.
        javax:
          cache:
            provider: org.ehcache.jsr107.EhcacheCachingProvider
            missing_cache_strategy: create
  sql:
    init:
      continue-on-error: true

  # Flyway schema migrations. See src/main/resources/db/migration/README.md.
  # Migrations dir starts empty; V1__baseline.sql is generated via
  # SchemaBaselineExporterTest as part of Phase 0.2 completion.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
    table: flyway_schema_history

app:
  title: Terran Republic Interstellar Plotting System (TRIPS)
  version: v0.8.0
  releaseDate: 10 December 2023
  contributors: LJ Mitchell, CE Gannon, R Boatright
  projectPage: https://github.com/ljramones/trips
  fileDirectory: ${trips.filesDirectory:${user.home}/.trips/files}
  programdata: ${trips.programDataDirectory:${user.home}/.trips/files/programdata}
  scriptDirectory: ${trips.scriptDirectory:${user.home}/.trips/files/scriptfiles}
  ui:
    window:
      width: 1080
      height: 680
      controlPaneHeight: 80

# Orekit orbital mechanics library configuration
orekit:
  data:
    path: ${user.home}/orekit-data

# Problem report feature configuration
# For development/testing: set TRIPS_DROPBOX_TOKEN environment variable
# For release builds: use -Prelease profile which embeds token at build time
problemreport:
  enabled: true
  logTailLines: 500
  pendingReportMaxDays: 30
  dropbox:
    accessToken: ${TRIPS_DROPBOX_TOKEN:}
    uploadPath: /trips-problem-reports/
  crashfile:
    enabled: true
    maxAgeDays: 7

management:
  server:
    port: 9091
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.ui.title}
