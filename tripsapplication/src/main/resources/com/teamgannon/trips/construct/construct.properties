editor.megastructure.tooltip.archetype=Primary structural category. Disguised moon, purpose-built fort, converted asteroid, big dumb object, engineered world.
editor.megastructure.tooltip.originType=Where the megastructure came from. Built (known or unknown civilisation) vs. found (intact or damaged).
editor.megastructure.tooltip.builderPolity=The polity that built it, when known. Meaningful only for BUILT_BY_KNOWN.
editor.megastructure.tooltip.discoveryYear=When discovered, for found objects. Leave blank for built objects.
editor.megastructure.tooltip.constructionYear=When built, when known. Leave blank for found objects or undated builds.
editor.megastructure.tooltip.dimensionsKm=Characteristic dimension: diameter for spherical objects, length for cylindrical, width for shellworlds.
editor.megastructure.tooltip.dryMassMegatons=Mass in megatons (1 MT = 10⁶ tons). Megastructure scale: 10⁶ to 10¹⁵ tons is typical.
editor.megastructure.tooltip.internalVolumeKm3=Interior volume, when meaningful. Zero for solid or interior-less objects.
editor.megastructure.tooltip.mobility=How much the object can move under its own control. Most megastructures stationkeep; a few are mobile or autonomously interstellar.
editor.megastructure.tooltip.auxiliaryDrive=Optional drive for non-FIXED megastructures (e.g. ORION pulses for Troy). "None" maps to a null aux drive on persist.
editor.megastructure.tooltip.primaryFunction=What the megastructure is for. Shared with StationFunction (30 values).
editor.megastructure.tooltip.secondaryFunctions=Supporting roles; typically 0-3 values. Cannot include the primary function.
editor.megastructure.tooltip.hasInteriorSetting=Whether the interior is a setting in its own right (cities, biomes, populations). Troy: yes. Pure weapon platforms: no.
editor.megastructure.tooltip.interiorPopulation=Approximate interior population. Zero for non-inhabited megastructures.
editor.megastructure.tooltip.interiorGravity=How gravity is provided inside. Natural mass, spin, artificial field, mixed, none, or unknown.

editor.megastructure.hint.secondaryCap=More than three secondary functions usually means the primary is wrong or MULTI_ROLE may be appropriate.

